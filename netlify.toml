[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()"
    # CSP: vlastní soubory + GTM/GA4 (kontejner GTM-MPVVNJCG má jen Google tag, žádný Custom HTML).
    # Inline <script> v HTML jsou povolené jen přes sha256 hash (consent default, třída "js",
    # "hero-pre" na homepage a console.log pozdrav na web/marketing/foceni) — po JAKÉKOLIV úpravě
    # inline skriptu přepočítej hash (postup v CLAUDE.md), jinak se skript přestane spouštět.
    # style-src 'unsafe-inline' je nutné: inline style="" atributy a <style> bloky jsou na většině stránek.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-WZRJfWvsnNCPcxzZwvyhovnZGqhZaC+8gPGPRbx6wTk=' 'sha256-1JC8ViriEP9TSlFw2tWJ/uhLr50vzzESxQurcRh92q0=' 'sha256-dY0RRt/imXzLE/WLyQl1r1mbYh14fe1goeZh1aQvKOw=' 'sha256-J/cCLSu5AEjmGM09CVdfSL53fhI+cutxIvehLXi197I=' 'sha256-vNGTrgfd66w3dImFw1nTcCgGkaRR2IRxMR7Y8peYarE=' 'sha256-tgGKIOxSqGoQ+lcg/gcrzHy+69Y7fFVH4hPrsFyZdLo=' 'sha256-LH2usgpxumYtwy2SQE6lyeY9boFnu7+uOA2aLc6f4Bg=' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://www.google.com; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://www.google.com https://stats.g.doubleclick.net; font-src 'self'; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Vendored third-party libs (GSAP) never change in
# place — a version bump means new files in a new/updated path — so it's safe
# to cache them for a year like jsDelivr/cdnjs used to.
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hostovaný font Inter: soubory se nikdy nemění na místě — při výměně
# fontu změň i název souboru (a @font-face v style.css), jinak by se držela stará verze.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fotky, logo a favicony: bez hashe v názvu, a občas se vymění na místě, proto
# jen týden (+ den "stale-while-revalidate"), ne rok.
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/logo.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/fav/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# style.min.css / script.min.js / cookie-consent.js záměrně BEZ dlouhé cache:
# názvy se nemění, takže by po deployi část návštěvníků dostala nové HTML se starým
# CSS/JS. Netlify je servíruje s ETag revalidací (304), což je levné.

# Hlavní stránka má jedinou adresu, shodnou s canonical a sitemapou.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Interní a zdrojové soubory leží v kořeni (publish = "."), ale veřejné být nemají:
# stránky načítají jen *.min.* verze. Vracíme 404 (obsah 404.html).
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/script.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/page.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/style.css"
  to = "/404.html"
  status = 404
  force = true

# Staré cesty z předchozí verze webu (viz Search Console 404), přesměrované
# na dnešní ekvivalenty.
[[redirects]]
  from = "/cz/gdpr/"
  to = "/gdpr"
  status = 301
  force = true

[[redirects]]
  from = "/cz/sitemap-cz/"
  to = "/sitemap"
  status = 301
  force = true

# Stránka o focení se dřív jmenovala fotografie.html.
[[redirects]]
  from = "/fotografie.html"
  to = "/foceni"
  status = 301
  force = true

# Jedna adresa na stránku: bez přípony .html (shodně s canonical, sitemapou a interními odkazy).
# Soubory se nepřejmenovávají, Netlify /web obslouží ze souboru web.html.
[[redirects]]
  from = "/web.html"
  to = "/web"
  status = 301
  force = true

[[redirects]]
  from = "/marketing.html"
  to = "/marketing"
  status = 301
  force = true

[[redirects]]
  from = "/foceni.html"
  to = "/foceni"
  status = 301
  force = true

[[redirects]]
  from = "/o-mne.html"
  to = "/o-mne"
  status = 301
  force = true

[[redirects]]
  from = "/kontakt.html"
  to = "/kontakt"
  status = 301
  force = true

[[redirects]]
  from = "/faq.html"
  to = "/faq"
  status = 301
  force = true

[[redirects]]
  from = "/gdpr.html"
  to = "/gdpr"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap.html"
  to = "/sitemap"
  status = 301
  force = true
