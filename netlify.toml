[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vendored third-party libs (GSAP) never change in
# place — a version bump means new files in a new/updated path — so it's safe
# to cache them for a year like jsDelivr/cdnjs used to.
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hostovaný font Inter: soubory se nikdy nemění na místě — při výměně
# fontu změň i název souboru (a @font-face v style.css), jinak by se držela stará verze.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fotky, logo a favicony: bez hashe v názvu, a občas se vymění na místě, proto
# jen týden (+ den "stale-while-revalidate"), ne rok.
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/logo.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/fav/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# style.min.css / script.min.js / cookie-consent.js záměrně BEZ dlouhé cache:
# názvy se nemění, takže by po deployi část návštěvníků dostala nové HTML se starým
# CSS/JS. Netlify je servíruje s ETag revalidací (304), což je levné.

# Hlavní stránka má jedinou adresu, shodnou s canonical a sitemapou.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Interní a zdrojové soubory leží v kořeni (publish = "."), ale veřejné být nemají:
# stránky načítají jen *.min.* verze. Vracíme 404 (obsah 404.html).
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/script.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/style.css"
  to = "/404.html"
  status = 404
  force = true

# Staré cesty z předchozí verze webu (viz Search Console 404), přesměrované
# na dnešní ekvivalenty.
[[redirects]]
  from = "/cz/gdpr/"
  to = "/gdpr.html"
  status = 301
  force = true

[[redirects]]
  from = "/cz/sitemap-cz/"
  to = "/sitemap.html"
  status = 301
  force = true

# Stránka o focení se dřív jmenovala fotografie.html.
[[redirects]]
  from = "/fotografie.html"
  to = "/foceni.html"
  status = 301
  force = true
