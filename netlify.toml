[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vendored third-party libs (Bootstrap, Bootstrap Icons, GSAP) never change in
# place — a version bump means new files in a new/updated path — so it's safe
# to cache them for a year like jsDelivr/cdnjs used to.
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hlavní stránka má jedinou adresu, shodnou s canonical a sitemapou.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Staré cesty z předchozí verze webu (viz Search Console 404), přesměrované
# na dnešní ekvivalenty.
[[redirects]]
  from = "/cz/gdpr/"
  to = "/gdpr.html"
  status = 301
  force = true

[[redirects]]
  from = "/cz/sitemap-cz/"
  to = "/sitemap.html"
  status = 301
  force = true
