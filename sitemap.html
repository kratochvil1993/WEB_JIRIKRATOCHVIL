<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  /* Minimal custom-cursor driver, mirroring script.js's cursor logic.
     Not the full script.js: it assumes index.html-only elements
     (#mainNav, #particle-canvas, pinned sections) and would throw here. */
  (function () {
    "use strict";
    var isMobile = window.matchMedia("(max-width: 991px)").matches;
    var cursor = document.getElementById("cursor");
    if (!cursor || isMobile) return;
    window.addEventListener("mousemove", function (e) {
      gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0.15, ease: "power2.out" });
    });
    document.querySelectorAll("a, button").forEach(function (el) {
      el.addEventListener("mouseenter", function () { cursor.classList.add("hover"); });
      el.addEventListener("mouseleave", function () { cursor.classList.remove("hover"); });
    });
  })();
</script>
